<g class="wk"><rect x="509" y="1046" width="172" height="56" rx="6"/><text class="t" x="595" y="1068" text-anchor="middle">ETKT worker</text><text class="m" x="595" y="1088" text-anchor="middle">.NET + Presidio</text></g>
<g class="wk"><rect x="699" y="1046" width="172" height="56" rx="6"/><text class="t" x="785" y="1068" text-anchor="middle">PNR worker</text><text class="m" x="785" y="1088" text-anchor="middle">.NET + Presidio</text></g>
<g class="wk"><rect x="889" y="1046" width="172" height="56" rx="6"/><text class="t" x="975" y="1068" text-anchor="middle">ACI worker</text><text class="m" x="975" y="1088" text-anchor="middle">.NET + Presidio</text></g>
<g class="wk"><rect x="1079" y="1046" width="172" height="56" rx="6"/><text class="t" x="1165" y="1068" text-anchor="middle">Seats worker</text><text class="m" x="1165" y="1088" text-anchor="middle">.NET + Presidio</text></g>
<g class="wk"><rect x="1269" y="1046" width="172" height="56" rx="6"/><text class="t" x="1355" y="1068" text-anchor="middle">PNR linking worker</text><text class="m" x="1355" y="1088" text-anchor="middle">.NET + Presidio</text></g>
<text class="s" x="509" y="1136">One task per feed: reads its PII queue, masks, publishes to its clean queue, then acks.</text>
<text class="s" x="509" y="1160">Presidio runs inside each worker through Python.NET. No HTTP calls.</text>

<rect x="1530" y="80" width="320" height="890" rx="12" fill="#EEF6E8" stroke="#3B6D11" stroke-width="1.5"/>
<text class="h" x="1546" y="106">Partner AWS</text>
<rect x="1560" y="130" width="260" height="800" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="1.5"/>
<text class="t" x="1690" y="526" text-anchor="middle">Partner core system</text>
