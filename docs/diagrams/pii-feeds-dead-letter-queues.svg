<path class="ln" d="M1430 208H1558" marker-end="url(#a)"/>
<path class="ln" d="M1430 258H1558" marker-end="url(#a)"/>
<path class="ln" d="M1430 308H1558" marker-end="url(#a)"/>
<path class="ln" d="M1430 420H1558" marker-end="url(#a)"/>
<path class="ln" d="M1430 530H1558" marker-end="url(#a)"/>
<path class="ln" d="M1430 640H1558" marker-end="url(#a)"/>
<path class="ln" d="M1430 750H1558" marker-end="url(#a)"/>
<path class="ln" d="M1430 860H1558" marker-end="url(#a)"/>

<rect x="30" y="1240" width="440" height="112" rx="10" fill="#FCEBEB" stroke="#A32D2D"/>
<text class="t" x="48" y="1268">DLQ inside the PII box</text>
<text class="s" x="48" y="1294">It holds unmasked passenger data, so it gets the</text>
<text class="s" x="48" y="1314">same access limits as the input queue.</text>
<rect x="490" y="1240" width="440" height="112" rx="10" fill="#FCEBEB" stroke="#A32D2D"/>
<text class="t" x="508" y="1268">One DLQ per feed, same broker</text>
<text class="s" x="508" y="1294">A failing feed never blocks the others. If a queue</text>
<text class="s" x="508" y="1314">moves to another broker, its DLQ moves with it.</text>
<rect x="950" y="1240" width="440" height="112" rx="10" fill="#FAEEDA" stroke="#BA7517"/>
<text class="t" x="968" y="1268">Ack only after the clean publish</text>
<text class="s" x="968" y="1294">Worker or Presidio error: no ack. The broker retries</text>
<text class="s" x="968" y="1314">3 to 5 times, then moves the message to the DLQ.</text>
<rect x="1410" y="1240" width="440" height="112" rx="10" fill="#F1EFE8" stroke="#888780"/>
<text class="t" x="1428" y="1268">Watch and replay</text>
<text class="s" x="1428" y="1294">Alert on DLQ depth. After a fix, move the messages</text>
<text class="s" x="1428" y="1314">back to the feed's input queue.</text>

<path class="ln" d="M30 1390H80" marker-end="url(#a)"/>
<text class="s" x="90" y="1395">Message flow</text>
<path class="dl" d="M220 1390H270" marker-end="url(#r)"/>
<text class="s" x="280" y="1395">Failed after max retries, moved by the broker</text>
