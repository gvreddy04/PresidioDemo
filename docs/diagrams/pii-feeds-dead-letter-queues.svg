<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1880 1420" role="img" aria-labelledby="title desc">
<title id="title">PII feeds with per-feed dead letter queues</title>
<desc id="desc">DemoAir reservation and operations feeds land on the integration Solace broker. PII feeds go to one PII box where each input queue has its own dead letter queue. The PII service AWS account runs one ECS worker per feed with Presidio in-process and publishes masked messages to the PII clean queues, which the partner core system consumes.</desc>
