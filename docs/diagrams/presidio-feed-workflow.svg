<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="950" viewBox="0 0 1860 950" role="img" aria-labelledby="title desc"><title id="title">Processing PII with Presidio</title><desc id="desc">Each feed has a Solace input queue. A .NET worker on AWS reads one message per feed, parses it with a feed codec, identifies configured fields, anonymizes them with Presidio running locally through Python.NET, rebuilds and validates the original format, and publishes to the protected topic. Rejected input goes to a restricted dead-letter queue. The input is acknowledged only after the broker confirms the output or dead letter. PNR stays unchanged.</desc><rect width="1860" height="950" fill="white"/><text x="930" y="69" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" fill="#292929">Processing PII with Presidio</text><rect x="30" y="110" width="1800" height="760" rx="30" fill="none" stroke="#8a9bad" stroke-width="2" stroke-dasharray="10 8"/><text x="60" y="145" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#666666">Customer AWS · private network</text><text x="175" y="205" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#666666">Solace broker</text><text x="175" y="238" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#292929">Input queues</text><rect x="70" y="258" width="210" height="410" rx="28" fill="white" stroke="#292929" stroke-width="2"/><rect x="88" y="278" width="174" height="58" rx="13" fill="white" stroke="#292929" stroke-width="2"/><text x="175" y="313" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#292929">ACI</text><rect x="88" y="356" width="174" height="58" rx="13" fill="white" stroke="#292929" stroke-width="2"/><text x="175" y="391" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#292929">ETKT</text><rect x="88" y="434" width="174" height="58" rx="13" fill="white" stroke="#292929" stroke-width="2"/><text x="175" y="469" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#292929">PNR</text><rect x="88" y="512" width="174" height="58" rx="13" fill="white" stroke="#292929" stroke-width="2"/><text x="175" y="547" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#292929">PNR-Linking</text><rect x="88" y="590" width="174" height="58" rx="13" fill="white" stroke="#292929" stroke-width="2"/><text x="175" y="625" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#292929">Seats</text><text x="1685" y="205" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#666666">Solace broker</text><text x="1685" y="238" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#292929">Protected topics</text><rect x="1580" y="258" width="210" height="410" rx="28" fill="white" stroke="#292929" stroke-width="2"/><rect x="1598" y="278" width="174" height="58" rx="13" fill="white" stroke="#292929" stroke-width="2"/><text x="1685" y="313" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#292929">ACI</text><rect x="1598" y="356" width="174" height="58" rx="13" fill="white" stroke="#292929" stroke-width="2"/><text x="1685" y="391" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#292929">ETKT</text><rect x="1598" y="434" width="174" height="58" rx="13" fill="white" stroke="#292929" stroke-width="2"/><text x="1685" y="469" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#292929">PNR</text><rect x="1598" y="512" width="174" height="58" rx="13" fill="white" stroke="#292929" stroke-width="2"/><text x="1685" y="547" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#292929">PNR-Linking</text><rect x="1598" y="590" width="174" height="58" rx="13" fill="white" stroke="#292929" stroke-width="2"/><text x="1685" y="625" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#292929">Seats</text><rect x="325" y="180" width="1210" height="580" rx="30" fill="#fcfcfc" stroke="#292929" stroke-width="2"/><text x="930" y="215" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#666666">.NET worker · ECS or EC2</text><rect x="360" y="330" width="150" height="280" rx="20" fill="white" stroke="#292929" stroke-width="2"/><text x="435.0" y="428.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#292929">Receive</text><text x="435.0" y="468.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#666666">FeedWorker</text><text x="435.0" y="493.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#666666">1 per feed</text><rect x="550" y="330" width="170" height="280" rx="20" fill="white" stroke="#292929" stroke-width="2"/><text x="635.0" y="428.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#292929">Parser</text><text x="635.0" y="468.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#666666">Feed codecs</text><text x="635.0" y="493.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#666666">Binary · JSON</text><rect x="760" y="355" width="420" height="230" rx="28" fill="#f3f7fc" stroke="#292929" stroke-width="2"/><text x="970" y="392" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#225fba">PII protection</text><rect x="775" y="420" width="185" height="95" rx="18" fill="white" stroke="#292929" stroke-width="2"/><text x="867.5" y="460" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#292929">Identification</text><text x="867.5" y="490" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#666666">Configured fields</text><rect x="990" y="420" width="175" height="95" rx="18" fill="white" stroke="#292929" stroke-width="2"/><text x="1077.5" y="460" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#292929">Anonymization</text><text x="1077.5" y="490" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#666666">Local Presidio</text><polyline points="960,467 984,467" fill="none" stroke="#292929" stroke-width="2"/><polyline points="973.20,461.78 984,467 973.20,472.22" fill="none" stroke="#292929" stroke-width="2"/><text x="970" y="555" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#666666">Mask · Replace · Keep PNR</text><rect x="1215" y="330" width="150" height="280" rx="20" fill="white" stroke="#292929" stroke-width="2"/><text x="1290.0" y="428.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#292929">Serializer</text><text x="1290.0" y="468.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#666666">Rebuild</text><text x="1290.0" y="493.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#666666">+ validate</text><rect x="1395" y="330" width="120" height="280" rx="20" fill="white" stroke="#292929" stroke-width="2"/><text x="1455.0" y="440.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#292929">Publish</text><text x="1455.0" y="480.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#666666">then ack</text><rect x="780" y="240" width="380" height="60" rx="16" fill="#f8fafc" stroke="#8a9bad" stroke-width="2"/><text x="970" y="266" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292929">Configuration</text><text x="970" y="289" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#666666">appsettings.json + 