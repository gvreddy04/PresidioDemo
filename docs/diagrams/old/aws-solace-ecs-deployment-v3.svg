<!-- Notes -->
<line x1="40" y1="884" x2="1460" y2="884" stroke="#D3D1C7"/>
<text class="t" x="40" y="912">How it scales</text>
<text class="s" x="40" y="936">One ECS service per feed, one shared image.</text>
<text class="s" x="40" y="958">Min 1 task; adds a task at 60 % CPU.</text>
<text class="s" x="40" y="980">Max tasks = queue partitions; PNR order kept.</text>
<text class="s" x="40" y="1002">Ack only after the publish is confirmed.</text>

<text class="t" x="400" y="912">Dead letters</text>
<text class="s" x="400" y="936">Worker: rejected, or after 5 deliveries.</text>
<text class="s" x="400" y="958">Broker backstop: after 10 deliveries.</text>
<text class="s" x="400" y="980">Both land in the feed's restricted DLQ.</text>
<text class="s" x="400" y="1002">Raw PII never goes to output.</text>

<text class="t" x="760" y="912">Needed from Solace</text>
<text class="s" x="760" y="936">Partitioned inputs; publisher sets PNR key</text>
<text class="s" x="760" y="958">Seats and PNR-Linking input queues</text>
<text class="s" x="760" y="980">Output queue and consumer per feed</text>
<text class="s" x="760" y="1002">DLQs · delivery count on · CA certificate</text>

<text class="t" x="1120" y="912">Code changes · password</text>
<text class="s" x="1120" y="936">Run one feed per task (feed setting)</text>
<text class="s" x="1120" y="958">Unique Solace client name per task</text>
<text class="s" x="1120" y="980">Secrets Manager sets SOLACE_PASSWORD</text>
<text class="s" x="1120" y="1002">Worker makes no AWS API call</text>
</svg>
