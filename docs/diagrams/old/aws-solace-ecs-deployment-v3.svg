<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1030" role="img" aria-labelledby="title desc">
<title id="title">Processing PII with Presidio: AWS deployment</title>
<desc id="desc">Harness builds one Docker image, pushes it to ECR and deploys five ECS services, one per feed. Each service reads its feed's partitioned Solace input queue, masks PII with Presidio in the same process, and publishes to the feed's output queue. The worker sends rejected messages, or messages delivered more than 5 times, to the feed's dead letter queue; the broker moves messages after 10 deliveries as a backstop. Each service keeps at least one task and scales on CPU up to the queue's partition count.</desc>
