      .box{fill:white;stroke:#61778d;stroke-width:2}
      .raw{fill:#eef4fc;stroke:#a9bfd8;stroke-width:1.5}.protected{fill:#edf7f2;stroke:#a9cdb9;stroke-width:1.5}.dead{fill:#fdf6ec;stroke:#e2cfae;stroke-width:1.5}
      .listener{fill:#f4f7fa;stroke:#b7c6d5;stroke-width:1.5}
      .connection{fill:none;stroke:#3e556b;stroke-width:2;marker-end:url(#arrow)}
