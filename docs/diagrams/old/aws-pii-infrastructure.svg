<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">PII infrastructure on AWS</title>
  <desc id="desc">Proposed development infrastructure in a private AWS VPC, drawn as five lanes, one per feed: ACI, ETKT, PNR, Seats and PNR Linking. In each lane, feed producers publish to that feed's exclusive raw queue on one Solace broker. One listener task for that feed on ECS Fargate reads the queue one message at a time in arrival order, protects PII with .NET and local Presidio embedded through Python.NET (pythonnet, presidio-analyzer, presidio-anonymizer, en_core_web_lg), and publishes to that feed's protected queue, where consumers read. Listeners connect with a native client; there are no HTTP or remote PII calls. Input is acknowledged only after the protected publish succeeds; messages not acknowledged after retries move to dead-message queues with no consumer access. Broker ACLs let listeners read raw queues and consumers read protected queues only. The broker is one EC2 instance in a single Availability Zone with an EBS volume and no high availability in dev. VPC endpoints carry platform traffic to Amazon ECR, S3, CloudWatch Logs and Secrets Manager, outside the PII path. The producer and consumer connection type is to be confirmed.</desc>
  <metadata>Project evidence: Projects/PresidioDemo/PresidioDemo.csproj; src/Program.cs; src/Models/Shared/FeedContracts.cs; src/Protection/Shared/PythonHost.cs; src/Protection/Shared/FeedProtection.cs; src/Protection/Shared/python/presidio_demo.py; src/Listener/Shared/FolderFeedTransport.cs. Current source runs one active delivery per feed through FolderFeedTransport and retains failed input in failed-feeds; Solace integration, exclusive queues, dead-message queues, broker ACLs and AWS deployment are proposed. No external documents used as evidence.</metadata>
