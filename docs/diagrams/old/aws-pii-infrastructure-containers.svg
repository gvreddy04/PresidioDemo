<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1275" viewBox="0 0 1920 1275" role="img" aria-labelledby="title desc">
  <title id="title">PII infrastructure on AWS</title>
  <desc id="desc">Proposed development infrastructure in a private AWS VPC, drawn as five lanes, one per feed: ACI, ETKT, PNR, Seats and PNR Linking. In each lane, producers publish to that feed's exclusive raw queue on one Solace broker. Each feed runs as one ECS Fargate task with one container, built from the same image. Inside the container, in process, the feed listens to its raw queue one message at a time in arrival order, parses the message, protects PII with local Presidio, serializes it back to the original format, validates the output and publishes it to that feed's protected queue, where consumers read. PII never leaves the container between stages. Presidio runs embedded through Python.NET (pythonnet, presidio-analyzer, presidio-anonymizer, en_core_web_lg); the PNR stays unchanged. Broker connections use a native client; there are no HTTP or remote PII calls. Input is acknowledged only after the protected publish succeeds; messages not acknowledged after retries move to dead-message queues with no consumer access, and their replay owner is to be confirmed. Broker ACLs let listeners read raw queues and consumers read protected queues only. The broker is one EC2 instance in a single Availability Zone with an EBS volume and no high availability in dev, to be confirmed. VPC endpoints carry platform traffic to Amazon ECR, S3, CloudWatch Logs and Secrets Manager, outside the PII path. The producer and consumer connection type is to be confirmed.</desc>
  <metadata>Project evidence: Projects/PresidioDemo/PresidioDemo.csproj; src/Program.cs; src/Models/Shared/FeedContracts.cs; src/Listener; src/Parser; src/Serializer; src/Protection/Shared/PythonHost.cs; src/Protection/Shared/FeedProtection.cs; src/Protection/Shared/python/presidio_demo.py; src/Listener/Shared/FolderFeedTransport.cs. Current source runs all feeds in one process with one active delivery per feed through FolderFeedTransport, validates output before publication and retains failed input in failed-feeds; one container per feed, Solace integration and publishing, exclusive queues, dead-message queues, broker ACLs and AWS deployment are proposed. No external documents used as evidence.</metadata>
