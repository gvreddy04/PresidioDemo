<!-- Notes -->
<line x1="40" y1="676" x2="1360" y2="676" stroke="#D3D1C7"/>
<text class="t" x="40" y="706">How it works</text>
<text class="s" x="40" y="732">Harness builds the image, pushes it to ECR and deploys to ECS.</text>
<text class="s" x="40" y="754">The worker reads a queue, masks PII and publishes.</text>
<text class="s" x="40" y="776">Input is acked only after the publish is confirmed.</text>
<text class="s" x="40" y="798">Rejected or 5x failed messages go to the DLQ.</text>

<text class="t" x="485" y="706">Needed from Solace</text>
<text class="s" x="485" y="732">Seats and PNR-Linking input queues</text>
<text class="s" x="485" y="754">Output queue and consumer per feed</text>
<text class="s" x="485" y="776">DLQs created, restricted like inputs</text>
<text class="s" x="485" y="798">Delivery count on · CA certificate</text>

<text class="t" x="930" y="706">Solace password</text>
<text class="s" x="930" y="732">Stored in Secrets Manager.</text>
<text class="s" x="930" y="754">ECS sets it as SOLACE_PASSWORD at start.</text>
<text class="s" x="930" y="776">No code change; the worker calls no AWS API.</text>
<text class="s" x="930" y="798">Execution role reads this one secret only.</text>
</svg>
