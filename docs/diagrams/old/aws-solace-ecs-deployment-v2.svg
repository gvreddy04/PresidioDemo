<text class="m" x="666" y="462">No HTTP · no remote service</text>
<g class="fw"><rect x="650" y="504" width="220" height="56" rx="6"/><text class="t" x="666" y="526">Publish, then ack</text><text class="m" x="666" y="546">ack after broker confirms</text></g>
