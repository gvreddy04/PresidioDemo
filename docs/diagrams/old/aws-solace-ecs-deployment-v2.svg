<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
<title id="title">Processing PII with Presidio: AWS deployment</title>
<desc id="desc">Harness builds the Docker image, pushes it to ECR and deploys it to ECS Fargate. The worker reads Solace input queues, masks PII with Presidio in the same process, and publishes to output queues or, on failure, to dead letter queues. The Solace password comes from Secrets Manager.</desc>
<defs>
