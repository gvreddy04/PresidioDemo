<g class="sv"><rect x="1080" y="332" width="260" height="70" rx="8"/><use href="#i-log" x="1096" y="345" width="16" height="16"/><text class="t" x="1120" y="358">CloudWatch</text><text class="m" x="1096" y="384">Logs · task alarm</text></g>
