<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">PII infrastructure on AWS</title>
  <desc id="desc">Proposed development infrastructure in a private AWS VPC, drawn as five lanes, one per feed: ACI, ETKT, PNR, Seats and PNR Linking. In each lane, feed producers publish to that feed's exclusive raw queue on one Solace broker. One listener task for that feed on ECS Fargate reads the queue one message at a time in arrival order. Each listener parses the message, protects PII, serializes it back to the original format, validates the output and publishes it to that feed's protected queue, where consumers read. PII is protected with .NET and local Presidio embedded through Python.NET (pythonnet, presidio-analyzer, presidio-anonymizer, en_core_web_lg); the PNR stays unchanged. Listeners connect with a native client; there are no HTTP or remote PII calls. Input is acknowledged only after the protected publish succeeds; messages not acknowledged after retries move to dead-message queues, which quarantine raw PII for all feeds with no consumer access. The replay owner for quarantined messages is to be confirmed. Broker ACLs let listeners read raw queues and consumers read protected queues only. The broker is one EC2 instance in a single Availability Zone with an EBS volume and no high availability in dev, to be confirmed. VPC endpoints carry platform traffic to Amazon ECR, S3, CloudWatch Logs and Secrets Manager, outside the PII path. The producer and consumer connection type is to be confirmed. Broker connections use TLS and the broker EBS volume is KMS encrypted. Protection is irreversible mask or replace, and delivery is at least once, so consumers may see duplicates. The Presidio model is bundled with no runtime download. To be confirmed: no internet egress from the VPC, broker admin through SSM only, ECR image scanning, broker credentials in Secrets Manager, CloudWatch alarms on queue and dead-message depth, no PII in logs, and the dead-message retry count, retention and replay owner.</desc>
  <metadata>Project evidence: Projects/PresidioDemo/PresidioDemo.csproj; src/Program.cs; src/Models/Shared/FeedContracts.cs; src/Parser; src/Serializer; src/Protection/Shared/PythonHost.cs; src/Protection/Shared/FeedProtection.cs; src/Protection/Shared/python/presidio_demo.py; src/Listener/Shared/FolderFeedTransport.cs. Current source runs one active delivery per feed through FolderFeedTransport, validates output before publication and retains failed input in failed-feeds; Solace integration and publishing, exclusive queues, dead-message queues, broker ACLs and AWS deployment are proposed. No external documents used as evidence.</metadata>
