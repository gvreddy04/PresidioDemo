width="2"/><polyline points="1260,438 1309,438" fill="none" stroke="#292929" stroke-width="2"/><polyline points="1298.1946347717678,443.21958640933474 1309,438 1298.1946347717678,432.78041359066526" fill="none" stroke="#292929" stroke-width="2"/><polyline points="1510,438 1594,438" fill="none" stroke="#292929" stroke-width="2"/><polyline points="1583.1946347717678,443.21958640933474 1594,438 1583.1946347717678,432.78041359066526" fill="none" stroke="#292929" stroke-width="2"/><rect x="835" y="615" width="390" height="65" rx="16" fill="white" stroke="#8a8a8a" stroke-width="2"/><text x="1030" y="654.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292929">Failed feeds / input retained</text><polyline points="1030,550 1030,609" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="8 6"/><polyline points="1024.7804135906651,598.1946347717678 1030,609 1035.2195864093349,598.1946347717678" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="1160" y="582.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#666666">On failure</text><text x="930" y="791.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#666666">Local Presidio via Python.NET  |  PNR stays unchanged  |  Publish only after validation</text><text x="930" y="839.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#666666">Current actual files: ACI, ETKT and Seats publish; PNR and PNR-Linking are retained.</text></svg>