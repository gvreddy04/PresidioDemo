<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="890" viewBox="0 0 1860 890" role="img" aria-labelledby="title desc"><title id="title">Processing PII with Presidio</title><desc id="desc">Input feeds pass through the local .NET listener, parser, configuration-based field identification, local Presidio anonymization and original-format serialization with validation before publication. Failures retain input.</desc><rect width="1860" height="890" fill="white"/><text x="930" y="69.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" fill="#292929">Processing PII with Presidio</text><rect x="305" y="140" width="1230" height="590" rx="30" fill="#fcfcfc" stroke="#292929" stroke-width="2"/><text x="920" y="181.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#666666">.NET application</text><text x="155" y="223.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#292929">Input feeds</text><rect x="50" y="245" width="210" height="425" rx="28" fill="white" stroke="#292929" stroke-width="2"/><rect x="68" y="265" width="174" height="58" rx="13" fill="white" stroke="#292929" stroke-width="2"/><text x="155" y="300.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#292929">ACI</text><rect x="68" y="343" width="174" height="58" rx="13" fill="white" stroke="#292929" stroke-width="2"/><text x="155" y="378.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#292929">ETKT</text><rect x="68" y="421" width="174" height="58" rx="13" fill="white" stroke="#292929" stroke-width="2"/><text x="155" y="456.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#292929">PNR</text><rect x="68" y="499" width="174" height="58" rx="13" fill="white" stroke="#292929" stroke-width="2"/><text x="155" y="534.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#292929">PNR_LINKING</text><rect x="68" y="577" width="174" height="58" rx="13" fill="white" stroke="#292929" stroke-width="2"/><text x="155" y="612.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#292929">SEATS</text><text x="1705" y="223.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#292929">Output feeds</text><rect x="1600" y="245" width="210" height="425" rx="28" fill="white" stroke="#292929" stroke-width="2"/><rect x="1618" y="265" width="174" height="58" rx="13" fill="white" stroke="#292929" stroke-width="2"/><text x="1705" y="300.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#292929">ACI</text><rect x="1618" y="343" width="174" height="58" rx="13" fill="white" stroke="#292929" stroke-width="2"/><text x="1705" y="378.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#292929">ETKT</text><rect x="1618" y="421" width="174" height="58" rx="13" fill="white" stroke="#292929" stroke-width="2"/><text x="1705" y="456.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#292929">PNR</text><rect x="1618" y="499" width="174" height="58" rx="13" fill="white" stroke="#292929" stroke-width="2"/><text x="1705" y="534.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#292929">PNR_LINKING</text><rect x="1618" y="577" width="174" height="58" rx="13" fill="white" stroke="#292929" stroke-width="2"/><text x="1705" y="612.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#292929">SEATS</text><rect x="360" y="280" width="145" height="320" rx="20" fill="white" stroke="#292929" stroke-width="2"/><text x="432.5" y="410.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#292929">Listener</text><text x="432.5" y="449.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#666666">Receive</text><text x="432.5" y="472.75" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#666666">&amp; route</text><rect x="560" y="280" width="190" height="320" rx="20" fill="white" stroke="#292929" stroke-width="2"/><text x="655" y="391.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#292929">Parser</text><text x="655" y="434.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#666666">Feed-specific</text><text x="655" y="459.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#666666">formats</text><rect x="805" y="315" width="450" height="230" rx="28" fill="#f3f7fc" stroke="#292929" stroke-width="2"/><text x="1030" y="355.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#225fba">PII protection</text><rect x="825" y="390" width="180" height="95" rx="18" fill="white" stroke="#292929" stroke-width="2"/><text x="915" y="432.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#292929">Identification</text><text x="915" y="462.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#666666">Configured fields</text><rect x="1050" y="390" width="180" height="95" rx="18" fill="white" stroke="#292929" stroke-width="2"/><text x="1140" y="432.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#292929">Anonymization</text><text x="1140" y="462.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#666666">Local Presidio</text><polyline points="1011,438 1044,438" fill="none" stroke="#292929" stroke-width="2"/><polyline points="1033.1946347717678,443.21958640933474 1044,438 1033.1946347717678,432.78041359066526" fill="none" stroke="#292929" stroke-width="2"/><rect x="840" y="210" width="380" height="70" rx="16" fill="#f8fafc" stroke="#8a9bad" stroke-width="2"/><text x