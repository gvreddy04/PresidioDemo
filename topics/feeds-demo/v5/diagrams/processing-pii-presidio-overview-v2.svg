<text x="1538" y="492" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#225fba" text-anchor="end">presidio-analyzer · presidio-anonymizer · spaCy en_core_web_lg</text>
<rect x="65" y="508" width="1470" height="42" rx="7" fill="#fff5e7" stroke="none"/>
<text x="82" y="535" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#925211" text-anchor="start">Current default: codec unconfigured → retain input; no output. Supplied sample: 560 of 920 bytes captured.</text>
<rect x="40" y="589" width="740" height="173" rx="12" fill="#fff" stroke="#cbd9e4"/>
<text x="60" y="620" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" fill="#19334b" text-anchor="start">Per-feed field policy · local XML</text>
<text x="60" y="652" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#587083" text-anchor="start">PNR: None + Keep → unchanged; bypass Python.</text>
<text x="60" y="679" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#587083" text-anchor="start">Name / email: Known + Replace → full-field labels.</text>
<text x="60" y="706" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#587083" text-anchor="start">Free text: Analyze selected entities + confidence threshold.</text>
<text x="60" y="733" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#587083" text-anchor="start">Actions: Keep · Replace · Mask · Redact. Unknown field → retain.</text>
<rect x="820" y="589" width="740" height="173" rx="12" fill="#f5fbf8" stroke="#b6d9cc"/>
<text x="840" y="620" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" fill="#087865" text-anchor="start">Independent strategy for each feed</text>
<text x="840" y="652" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#587083" text-anchor="start">Router → ETKT / PNR / PNR Linking / Seats / ACI.</text>
<text x="840" y="679" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#587083" text-anchor="start">Each strategy receives its own codec and field rules.</text>
<text x="840" y="706" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#587083" text-anchor="start">One active delivery per feed; parse / rebuild / I/O can overlap.</text>
<text x="840" y="733" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#587083" text-anchor="start">Shared Presidio calls serialized per field; long NLP calls wait.</text>
