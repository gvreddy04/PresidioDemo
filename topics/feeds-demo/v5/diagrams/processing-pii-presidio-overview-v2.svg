<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220" role="img" aria-labelledby="title desc"><title id="title">Processing PII with Presidio — Quick overview</title><desc id="desc">Six-step binary feed workflow with embedded local Presidio. No JSON or tokenization. Current folders simulate MQ; AWS is the target hosting environment. Producer codec is not configured and supplied capture is incomplete. Inputs are deleted only after validated output delivery; failures retain input. Fictional passenger samples illustrate an unchanged shared PNR.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#225fba"/></marker><marker id="failure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#925211"/></marker></defs>
